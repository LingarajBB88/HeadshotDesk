# The two checks CLAUDE.md requires before handing work over, run on every
# push so nobody has to remember: the backend test suite against a real
# Postgres, and the Next.js production build (tsc alone misses Next's
# page-export rules, which once broke every Vercel deploy for days).
name: checks

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: headshotdesk
          POSTGRES_PASSWORD: headshotdesk
          POSTGRES_DB: headshotdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U headshotdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://headshotdesk:headshotdesk@localhost:5432/headshotdesk
      REDIS_URL: redis://localhost:6379/0
      LOCAL_STORAGE_ROOT: /tmp/uploads
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Same as the Dockerfile: install from pyproject alone. The backend
      # folder is not a package, so installing it in place would fail on
      # setuptools' package discovery.
      - run: mkdir -p /tmp/deps && cp pyproject.toml /tmp/deps/ && pip install "/tmp/deps[dev]"
      - run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.headshotdesk.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
