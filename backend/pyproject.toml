[project]
name = "headshotdesk-backend"
version = "0.1.0"
description = "HeadshotDesk backend API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary,pool]>=3.2.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "stripe>=11.1.0",
    "boto3>=1.35.0",          # for R2 (S3-compatible)
    "pillow>=10.4.0",
    "openpyxl>=3.1.5",        # participant lists as .xlsx
    "numbers-parser>=4.4.0",  # participant lists as Apple Numbers
    "ulid-py>=1.1.0",
    "rq>=2.0.0",              # background jobs
    "redis>=5.1.0",
    "postmarker>=1.0",        # transactional email
    "jinja2>=3.1.0",          # HSD-48 template engine for outbound messages
    "segno>=1.6.1",           # signup QR codes (pure Python, no dependencies)
    "sentry-sdk[fastapi]>=2.18.0",  # error tracking; no-op without a DSN
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    # Opts out of conftest's auto_verify_signups fixture, so the test gets a
    # genuinely unverified account. Only the verification tests want this.
    "unverified: leave accounts unverified for this test",
]
