{# Plain, letter-like layout on purpose: this is a one-to-one message from
   a person, not a marketing template. Inline styles only (email clients
   strip <style> blocks), system font stack, generous line height. #}
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#0B0F1A;max-width:520px;">
  <p style="margin:0 0 16px;">Hi {{ user.name }},</p>

  <p style="margin:0 0 16px;">
    Someone (hopefully you) asked to reset the password on your
    {{ app.name }} account. Here&rsquo;s the link:
  </p>

  <p style="margin:0 0 16px;">
    <a href="{{ reset.url }}"
       style="display:inline-block;background:#5B6CFF;color:#FFFFFF;padding:11px 20px;border-radius:8px;text-decoration:none;font-weight:600;">
      Reset your password
    </a>
  </p>

  <p style="margin:0 0 16px;color:#475569;">
    It works for the next {{ reset.expires_in }}, then it stops working and
    you can ask for a new one.
  </p>

  <p style="margin:0 0 24px;color:#475569;">
    If this wasn&rsquo;t you, nothing has changed on your account and you
    can ignore this email.
  </p>

  <p style="margin:0;padding-top:16px;border-top:1px solid #E5E7EB;">
    {{ app.sender_name }}<br />
    <span style="color:#475569;">{{ app.sender_role }}</span><br />
    <a href="mailto:{{ app.support_email }}" style="color:#5B6CFF;text-decoration:none;">{{ app.support_email }}</a>
  </p>
</div>
