{% if client.logo_url %}
<p style="margin-bottom:16px;">
  <img src="{{ client.logo_url }}" alt="{{ job.client_name or 'Company logo' }}"
       style="max-width:160px;max-height:64px;height:auto;" />
</p>
{% endif %}
<p>Hi {{ participant.first_name }},</p>
<p>Your headshots from <strong>{{ job.name }}</strong> are ready to view and download.</p>
<p>
  <a href="{{ gallery.url }}"
     style="display:inline-block;background:#5B6CFF;color:#FFFFFF;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:600;">
    View your gallery
  </a>
</p>
<p>{{ photographer.display_name }}</p>
