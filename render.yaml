# Render Blueprint — HeadshotDesk backend (api.headshotdesk.com)
#
# Frontend deploys separately on Vercel; this file covers the FastAPI
# service + managed Postgres, both in Frankfurt so participant data stays
# in the EU. Redis intentionally omitted — configured in code but unused
# in v0.1; add a `keyvalue` service here when background jobs land.
#
# First-time setup: Render dashboard → New → Blueprint → point at this
# repo. Render reads this file and provisions everything. Secrets marked
# sync: false must be pasted in the dashboard (see docs/DEPLOY.md).

services:
  # Daily scheduled email: shoot reminders, trial warnings.
  #
  # A cron job rather than a worker + queue. Redis and RQ are already
  # dependencies, but nothing here needs sub-minute latency — everything is
  # "some time today" — and a cron is one moving part instead of three.
  # When it fails you get a failed job in the dashboard rather than silence
  # and a queue nobody is watching.
  #
  # 06:00 UTC: participants get their reminder over breakfast the day
  # before, not at midnight.
  #
  # Every send is gated on a NULL timestamp set immediately after, so this
  # is safe to re-run by hand.
  - type: cron
    name: headshotdesk-daily-email
    runtime: docker
    rootDir: backend
    region: frankfurt
    plan: starter
    schedule: "0 6 * * *"
    dockerCommand: python scripts/send_scheduled_emails.py
    envVars:
      - key: ENV
        value: production
      - key: FRONTEND_URL
        value: https://headshotdesk.com
      - key: DATABASE_URL
        fromDatabase:
          name: headshotdesk-db
          property: connectionString
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: headshotdesk-api
    runtime: docker
    # No repo: field — Render defaults to the repo containing this blueprint.
    rootDir: backend
    region: frankfurt
    plan: starter
    # Two instances so a deploy, a crash, or an OOM isn't a full outage.
    # A photographer mid-shoot has no way to wait for a restart, and the
    # cost of the second instance is far less than one ruined event.
    numInstances: 2
    # /health verifies the database, so an instance whose connection has
    # died gets pulled and restarted instead of quietly 500ing everything.
    healthCheckPath: /health
    # Migrations run once per deploy, before any new instance takes
    # traffic, and a failure here aborts the deploy while the old version
    # keeps serving. They used to run inside the web process on every boot,
    # which meant a locked migration took the API down entirely.
    preDeployCommand: alembic upgrade head
    # start.sh now only execs uvicorn. Kept as a script — a quoted sh -c
    # one-liner here breaks because Render already wraps dockerCommand in a
    # shell (the quotes arrive literally, exit 127).
    dockerCommand: ./start.sh
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: BASE_URL
        value: https://api.headshotdesk.com
      - key: FRONTEND_URL
        value: https://headshotdesk.com
      # Error tracking. Paste the DSN in the dashboard; leaving it unset
      # disables Sentry rather than breaking the boot.
      - key: SENTRY_DSN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: headshotdesk-db
          property: connectionString
      # --- Secrets: set these in the Render dashboard, never in git ---
      - key: JWT_SECRET
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: headshotdesk-prod
      - key: R2_JURISDICTION
        value: eu
      - key: EMAIL_FROM
        value: "HeadshotDesk <hello@headshotdesk.com>"

databases:
  - name: headshotdesk-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
